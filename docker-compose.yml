services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: ${CHESSU_CLIENT_IMAGE:-chessu-client:latest}
    container_name: chessu_client
    environment:
      # the frontend only knows the API gateway
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - chessu_network

  # single public entry point, forwards /identity, /game and /stats to the internal services
  api-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ${CHESSU_GATEWAY_IMAGE:-chessu-gateway:latest}
    container_name: chessu_gateway
    environment:
      PORT: 8080
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      IDENTITY_SERVICE_URL: http://identity-service:4001
      GAME_SERVICE_URL: http://game-service:4002
      STATS_SERVICE_URL: http://stats-history-service:4003
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    # no health conditions: the gateway runs even when a service is down and answers 503 for it
    depends_on:
      - identity-service
      - game-service
      - stats-history-service
    networks:
      - chessu_network

  identity-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    image: ${CHESSU_IDENTITY_IMAGE:-chessu-identity:latest}
    container_name: chessu_identity
    environment:
      PORT: 4001
      DATABASE_URL: postgres://user:password@identity-db:5432/chessu_identity
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-token-secret}
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chessu_network

  game-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/game-service/Dockerfile
    image: ${CHESSU_GAME_IMAGE:-chessu-game:latest}
    container_name: chessu_game
    environment:
      PORT: 4002
      DATABASE_URL: postgres://user:password@game-db:5432/chessu_game
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      # verifies the tokens signed by identity-service, no call to identity-service needed
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-token-secret}
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      game-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chessu_network

  stats-history-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/stats-history-service/Dockerfile
    image: ${CHESSU_STATS_IMAGE:-chessu-stats:latest}
    container_name: chessu_stats
    environment:
      PORT: 4003
      DATABASE_URL: postgres://user:password@stats-db:5432/chessu_stats
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      # used only once, to initialize empty read models
      IDENTITY_SERVICE_URL: http://identity-service:4001
      GAME_SERVICE_URL: http://game-service:4002
    ports:
      - "127.0.0.1:4003:4003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      stats-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - chessu_network

  identity-db:
    image: postgres:15
    container_name: chessu_identity_db
    environment:
      POSTGRES_DB: chessu_identity
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chessu_identity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessu_network

  game-db:
    image: postgres:15
    container_name: chessu_game_db
    environment:
      POSTGRES_DB: chessu_game
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - game_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chessu_game"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessu_network

  stats-db:
    image: postgres:15
    container_name: chessu_stats_db
    environment:
      POSTGRES_DB: chessu_stats
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - stats_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chessu_stats"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessu_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chessu_rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - chessu_network

  legacy-db:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_DB: chessu
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chessu"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chessu_network

volumes:
  postgres_data:
  identity_postgres_data:
  game_postgres_data:
  stats_postgres_data:

networks:
  chessu_network:
    driver: bridge

name: Deploy EC2 Microservices

# Continuous delivery: after CI passes, build the 4 backend images, push them to GHCR,
# then SSH into the EC2 host and restart the stack with Docker Compose.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - microsservices
    types:
      - completed

# never run two deployments at the same time
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  # the commit CI tested (workflow_run) or the commit picked manually (workflow_dispatch)
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-gateway
          - identity-service
          - game-service
          - stats-history-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Image name
        id: image
        # GHCR requires lowercase names, the repository name contains uppercase letters
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.DEPLOY_SHA }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Copy docker-compose.yml to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          # the directory name is the Compose project name, keep it equal to the local one
          target: chess-u

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          CHESSU_GATEWAY_IMAGE: ${{ steps.image.outputs.prefix }}/api-gateway:${{ env.DEPLOY_SHA }}
          CHESSU_IDENTITY_IMAGE: ${{ steps.image.outputs.prefix }}/identity-service:${{ env.DEPLOY_SHA }}
          CHESSU_GAME_IMAGE: ${{ steps.image.outputs.prefix }}/game-service:${{ env.DEPLOY_SHA }}
          CHESSU_STATS_IMAGE: ${{ steps.image.outputs.prefix }}/stats-history-service:${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,SESSION_SECRET,TOKEN_SECRET,CHESSU_GATEWAY_IMAGE,CHESSU_IDENTITY_IMAGE,CHESSU_GAME_IMAGE,CHESSU_STATS_IMAGE
          command_timeout: 15m
          script: |
            set -e
            cd ~/chess-u
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # remember the deployed versions so later manual `docker compose` commands use them too
            cat > .env <<EOF
            GATEWAY_PORT=80
            CHESSU_GATEWAY_IMAGE=$CHESSU_GATEWAY_IMAGE
            CHESSU_IDENTITY_IMAGE=$CHESSU_IDENTITY_IMAGE
            CHESSU_GAME_IMAGE=$CHESSU_GAME_IMAGE
            CHESSU_STATS_IMAGE=$CHESSU_STATS_IMAGE
            SESSION_SECRET=$SESSION_SECRET
            TOKEN_SECRET=$TOKEN_SECRET
            EOF
            chmod 600 .env
            docker compose pull api-gateway identity-service game-service stats-history-service
            docker compose up -d --no-build --wait api-gateway identity-service game-service stats-history-service
            docker logout ghcr.io
            docker image prune -f
            docker compose ps

      - name: Smoke check through the API gateway
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          for service in identity game stats; do
            curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "http://$HOST/$service/health"
            echo
          done
